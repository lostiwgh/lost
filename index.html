<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    overflow:hidden;
    color:white;
    display:flex;
    flex-wrap:wrap;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.left{
    flex:1;
    min-width:280px;
    padding:40px;
    text-align:center;
    background:rgba(255,255,255,.05);
}

.avatar{
    width:180px;
    height:180px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    margin-bottom:20px;
}

.left h1{
    font-size:32px;
}

.left p{
    margin-top:10px;
    opacity:.9;
}

.right{
    flex:2;
    min-width:300px;
    padding:40px;
}

.title{
    font-size:28px;
    margin-bottom:20px;
}

.about{
    line-height:1.8;
    opacity:.9;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

.skill{
    padding:10px 18px;
    border-radius:50px;
    background:rgba(255,255,255,.2);
}

.social{
    display:flex;
    gap:15px;
    margin-top:35px;
}

.social a{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    transition:.3s;
}

.social a:hover{
    background:white;
    color:#00aaff;
}

button{
    margin-top:35px;
    padding:14px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:white;
    color:#0099ff;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

@media(max-width:768px){
.card{
flex-direction:column;
}
}
</style>
</head>

<body>

<div class="card">

<div class="left">

<img class="avatar"
src="https://i.pravatar.cc/300"
alt="avatar">

<h1>Pham Cao Truc Duong</h1>

<p>💻 Web Developer</p>

<button onclick="hello()">Xin chào 👋</button>

</div>

<div class="right">

<h2 class="title">Giới thiệu</h2>

<p class="about">
Xin chào! Mình là một lập trình viên yêu thích thiết kế giao diện đẹp,
hiện đại và tối giản. Mình có kinh nghiệm với HTML, CSS, JavaScript
và luôn học hỏi thêm các công nghệ mới.
</p>

<div class="skills">
<div class="skill">HTML5</div>
<div class="skill">CSS3</div>
<div class="skill">JavaScript</div>
<div class="skill">React</div>
<div class="skill">UI/UX</div>
<div class="skill">NodeJS</div>
</div>

<div class="social">
<a href="#">Facebook</a>
<a href="#">GitHub</a>
<a href="#">Instagram</a>
</div>

</div>

</div>

<script>
function hello(){
    alert("Cảm ơn bạn đã ghé thăm trang profile của mình ❤️");
}
</script>

</body>
</html>
